services:

  mysql:
    image: mysql:8
    container_name: furniture-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: FurnitureDB

    ports:
      - "3307:3306"

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend